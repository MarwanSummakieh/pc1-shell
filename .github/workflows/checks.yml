name: shell
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y curl unzip libfontconfig1 libxkbcommon0 libgl1 libasound2t64
      - name: Fetch pinned editor and exercise controller flows
        shell: bash
        run: |
          source config/godot.env
          archive="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${archive}" -o /tmp/editor.zip
          printf '%s  %s\n' "$GODOT_EDITOR_SHA512" /tmp/editor.zip | sha512sum -c -
          unzip -q /tmp/editor.zip -d /tmp/pc1-editor
          GODOT_BIN="/tmp/pc1-editor/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" bash scripts/check-shell.sh