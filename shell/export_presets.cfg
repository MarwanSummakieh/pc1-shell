; MarwanOS shell -- export presets.
;
; The image build names this preset by its `name` field:
;
;   godot --headless --path shell --export-release "Linux" <output>.x86_64
;
; so renaming it breaks the Containerfile -- which asserts `^name="Linux"$` in
; this file before it runs, so at least it breaks loudly. Deleting the file breaks
; the build with an error that points at the export step rather than at the
; missing file. It is tracked in git for exactly that reason.
;
; Godot rewrites this file whenever a preset is touched in the editor and its
; writer drops comments, so read README.md before assuming any of the below is
; still explained here. Two fields in particular must survive an editor save:
; `binary_format/embed_pck` and `custom_template/release`.

[preset.0]

; The preset name, not the platform -- this is the string --export-release
; resolves. It happens to equal the platform name because that is what the editor
; defaults to when a preset is added, and matching it keeps the two from being
; confusable for each other.
name="Linux"

; Must match EditorExportPlatformLinuxBSD's registered name exactly, or the
; preset is skipped at load and the export fails with "no such preset".
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""

; Only used when exporting from the editor; the CLI export passes its own path.
; /out/ is gitignored at the repo root -- an exported binary must never land in
; git (M3's checklist: "no hand-exported binaries in git").
export_path="../out/marwanos-shell.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="x86_64"

; The single most important line in this file.
;
; Off (the default) the export is `marwanos-shell.x86_64` PLUS a sibling
; `marwanos-shell.pck` that the engine finds by matching basenames. Both places
; the shell is consumed want one self-contained file: BAKED_CLIENT in
; marwanos-session is a single path, and D5's dev loop is `scp` of a single file
; to /var/marwanos/dev-shell/marwanos-shell. A two-file export would mean editing
; resolve_client() and turning a ten-second loop into a session-script change.
;
; Re-saving this preset in the editor GUI can silently flip it back to false, at
; which point the image ships a binary whose pck was never copied and the TV goes
; black with nothing in the journal. The Containerfile greps for this line before
; running the export, and asserts no .pck was produced after it.
binary_format/embed_pck=true

; Empty means "use the export template installed under XDG_DATA_HOME". The build
; stage may instead point this at the template it extracted from the .tpz. Never
; commit an absolute path here -- it would be a path from whoever last opened the
; editor, and it only fails on someone else's machine.
custom_template/debug=""
custom_template/release=""

; No console wrapper. The appliance has no console to wrap, and the wrapper is a
; second file, which defeats embed_pck above.
debug/export_console_wrapper=0

; The project imports zero textures (see README.md), so neither of these can
; matter -- but the exporter refuses to run with every VRAM format disabled, so
; one has to be on. Desktop GPUs are the S3TC/BPTC family.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
